services:
  app:
    build: .
    container_name: datascience_app
    restart: always
    volumes:
      # Share the generated static files with Nginx
      - static_data:/var/www/htmx_website
      # Mount client_secret.json for Google OAuth (create this file with your credentials)
      - ./client_secret.json:/app/client_secret.json:ro
    environment:
      # Google OAuth - can also be loaded from client_secret.json
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://datascience-adventure.xyz/login}
      # Comma-separated list of allowed emails (leave empty to allow all)
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      # Flask session secret key (CHANGE THIS IN PRODUCTION)
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
    networks:
      - web_network
    
  nginx:
    image: nginx:alpine
    container_name: datascience_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot:ro
      - ./nginx/nginx-docker.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-bootstrap.sh:ro
      - static_data:/var/www/htmx_website
    depends_on:
      - app
    networks:
      - web_network
    # Bootstrap: generate self-signed cert if missing, then start nginx with reload loop
    entrypoint: ["/bin/sh", "/docker-entrypoint-bootstrap.sh"]
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: datascience_certbot
    restart: always
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # On first boot: wait for nginx, obtain cert if missing, then renewal loop every 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; sleep 15; certbot certonly --webroot -w /var/www/certbot -d datascience-adventure.xyz --non-interactive --agree-tos --register-unsafely-without-email --keep-existing; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - web_network

volumes:
  static_data:
  letsencrypt_data:
  certbot_webroot:

networks:
  web_network:
    external: true
