server {
    listen 80;
    server_name datascience-adventure.xyz www.datascience-adventure.xyz localhost;
    
    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Allow ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name datascience-adventure.xyz www.datascience-adventure.xyz;

    ssl_certificate /etc/letsencrypt/live/datascience-adventure.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datascience-adventure.xyz/privkey.pem;
    
    # SSL Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/htmx_website;

    # Serve static files
    location /styles/ {
        alias /var/www/htmx_website/styles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /templates/ {
        alias /var/www/htmx_website/templates/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /logos/ {
        alias /var/www/htmx_website/logos/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy for Mission 7 Dashboard
    location /mission7/ {
        proxy_pass http://homecredit_nginx:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite links and references for the subpath
        sub_filter_types text/html;
        sub_filter 'href="/' 'href="/mission7/';
        sub_filter 'src="/' 'src="/mission7/';
        sub_filter 'action="/' 'action="/mission7/';
        sub_filter "fetch('/" "fetch('/mission7/";
        sub_filter 'fetch("/' 'fetch("/mission7/';
        sub_filter 'const GOOGLE_REDIRECT_URI = window.location.origin;' 'const GOOGLE_REDIRECT_URI = window.location.origin + "/mission7";';
        sub_filter_once off;
    }

    # Proxy for Mission 7 MLflow
    location /mission7/mlflow/ {
        proxy_pass http://homecredit_mlflow:5002/;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # MLflow needs some rewrites to work under a subpath
        sub_filter_types text/html application/javascript;
        sub_filter 'href="/' 'href="/mission7/mlflow/';
        sub_filter 'src="/' 'src="/mission7/mlflow/';
        sub_filter 'static-files/' 'mission7/mlflow/static-files/';
        sub_filter_once off;
    }

    # Handle other dynamic requests
    location / {
        try_files $uri @flask;
    }

    # Proxy requests to Flask
    location @flask {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix for large files
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Custom 404 error page
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/htmx_website;
    }
}
