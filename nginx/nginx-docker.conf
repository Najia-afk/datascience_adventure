# Upstream for Mission 7 - resilient configuration with DNS resolution
# This allows nginx to start even if mission7 is not running
resolver 127.0.0.11 valid=30s ipv6=off;

# Map for dynamic upstream (allows graceful fallback if service unavailable)
map $host $mission7_upstream {
    default mission7_nginx_prod;
}

server {
    listen 80;
    server_name datascience-adventure.xyz www.datascience-adventure.xyz localhost;
    
    # Redirect HTTP to HTTPS (except for local development)
    location / {
        # Check if we're on localhost (dev) or production
        if ($host = localhost) {
            # For local dev, serve directly without HTTPS redirect
            return 200;
        }
        return 301 https://$host$request_uri;
    }

    # Allow ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name datascience-adventure.xyz www.datascience-adventure.xyz;

    ssl_certificate /etc/letsencrypt/live/datascience-adventure.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datascience-adventure.xyz/privkey.pem;
    
    # SSL Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/htmx_website;

    # Serve static files
    location /styles/ {
        alias /var/www/htmx_website/styles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /templates/ {
        alias /var/www/htmx_website/templates/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /logos/ {
        alias /var/www/htmx_website/logos/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ===== Auth endpoints - always proxy to Flask app =====
    location /auth/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login page
    location = /login {
        proxy_pass http://app:8000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service unavailable page
    location = /service-unavailable {
        proxy_pass http://app:8000/service-unavailable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== Internal auth check location =====
    location = /internal/auth/check {
        internal;
        proxy_pass http://app:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ===== Mission 7 Notebook HTML (without trailing slash) =====
    # Serves the static notebook HTML via Flask
    location = /mission7 {
        proxy_pass http://app:8000/mission7;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Mission 8 Notebook HTML (without trailing slash) =====
    # Serves the static notebook HTML via Flask
    location = /mission8 {
        proxy_pass http://app:8000/mission8;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Mission 7 Dashboard - Protected with auth =====
    location /mission7/ {
        # Require authentication
        auth_request /internal/auth/check;
        auth_request_set $auth_status $upstream_status;
        
        # On 401, redirect to login page
        error_page 401 = @mission7_login_redirect;
        
        # On 502/503/504 (backend down), show service unavailable page
        error_page 502 503 504 = @mission7_unavailable;

        # Proxy settings with resilient timeouts
        set $mission7_backend http://mission7_nginx_prod:80;
        proxy_pass $mission7_backend;
        
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mission7;

        # Rewrite links for subpath (kept minimal - only essential rewrites)
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/' 'href="/mission7/';
        sub_filter 'src="/' 'src="/mission7/';
        sub_filter 'action="/' 'action="/mission7/';
        sub_filter "fetch('/" "fetch('/mission7/";
        sub_filter 'fetch("/' 'fetch("/mission7/';
        sub_filter_once off;
    }

    # Mission 7 MLflow - Protected with auth
    location /mission7/mlflow/ {
        # Require authentication
        auth_request /internal/auth/check;
        error_page 401 = @mission7_login_redirect;
        error_page 502 503 504 = @mission7_unavailable;

        set $mlflow_backend http://mission7_mlflow_prod:5002;
        proxy_pass $mlflow_backend;
        
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # MLflow URL rewrites
        sub_filter_types text/html application/javascript text/css;
        sub_filter 'href="/' 'href="/mission7/mlflow/';
        sub_filter 'src="/' 'src="/mission7/mlflow/';
        sub_filter_once off;
    }

    # Named location for login redirect
    location @mission7_login_redirect {
        return 302 /login?return_to=$request_uri;
    }

    # Named location for service unavailable
    location @mission7_unavailable {
        # Use internal redirect instead of proxy_pass in named location
        rewrite ^ /service-unavailable break;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    # Handle other dynamic requests
    location / {
        try_files $uri @flask;
    }

    # Proxy requests to Flask
    location @flask {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix for large files
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Custom 404 error page
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/htmx_website;
    }
}
