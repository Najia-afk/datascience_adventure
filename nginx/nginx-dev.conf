# Nginx configuration for LOCAL DEVELOPMENT
# No SSL, no external dependencies, works standalone
#
# Access: http://localhost:8080
#

# Docker DNS resolver for dynamic upstreams
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name localhost;

    root /var/www/htmx_website;

    # Serve static files
    location /styles/ {
        alias /var/www/htmx_website/styles/;
        expires 1h;
    }

    location /templates/ {
        alias /var/www/htmx_website/templates/;
        expires 1h;
    }

    location /logos/ {
        alias /var/www/htmx_website/logos/;
        expires 1h;
    }

    # ===== Auth endpoints - always proxy to Flask app =====
    location /auth/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login page
    location = /login {
        proxy_pass http://app:8000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service unavailable page
    location = /service-unavailable {
        proxy_pass http://app:8000/service-unavailable;
        proxy_set_header Host $host;
    }

    # ===== Internal auth check location =====
    location = /internal/auth/check {
        internal;
        proxy_pass http://app:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ===== Mission7 API routes (for iframe requests) =====
    # These catch requests from mission7's JavaScript that use absolute paths
    location /api/ {
        # Check if request came from dashboard_mission7 iframe
        if ($http_referer ~* "/dashboard_mission7") {
            set $mission7_backend http://mission7_nginx_prod:80;
            proxy_pass $mission7_backend;
        }
        # Default: proxy to Flask app
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        if ($http_referer ~* "/dashboard_mission7") {
            set $mission7_backend http://mission7_nginx_prod:80;
            proxy_pass $mission7_backend;
        }
        return 404;
    }

    location = /predict {
        if ($http_referer ~* "/dashboard_mission7") {
            set $mission7_backend http://mission7_nginx_prod:80;
            proxy_pass $mission7_backend;
        }
        return 404;
    }

    location /clients {
        if ($http_referer ~* "/dashboard_mission7") {
            set $mission7_backend http://mission7_nginx_prod:80;
            proxy_pass $mission7_backend;
        }
        return 404;
    }

    # Redirect /dashboard_mission7 to /dashboard_mission7/
    location = /dashboard_mission7 {
        return 301 $scheme://$http_host/dashboard_mission7/;
    }

    # ===== Mission 7 Dashboard - Protected with auth =====
    location /dashboard_mission7/ {
        # Require authentication
        auth_request /internal/auth/check;
        auth_request_set $auth_status $upstream_status;
        
        # On 401, redirect to login page
        error_page 401 = @mission7_login_redirect;
        
        # On 502/503/504 (backend down), show service unavailable page
        error_page 502 503 504 = @mission7_unavailable;

        # Set backend URL first (must be before rewrite break)
        set $mission7_backend http://mission7_nginx_prod:80;
        
        # Strip /dashboard_mission7 prefix and proxy to mission7
        rewrite ^/dashboard_mission7/(.*)$ /$1 break;
        
        # Proxy to mission7
        proxy_pass $mission7_backend;
        
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Rewrite absolute paths in HTML/JS responses to use /dashboard_mission7 prefix
        sub_filter 'href="/' 'href="/dashboard_mission7/';
        sub_filter "href='/" "href='/dashboard_mission7/";
        sub_filter 'src="/' 'src="/dashboard_mission7/';
        sub_filter "src='/" "src='/dashboard_mission7/";
        sub_filter 'action="/' 'action="/dashboard_mission7/';
        sub_filter 'fetch("/' 'fetch("/dashboard_mission7/';
        sub_filter "fetch('/" "fetch('/dashboard_mission7/";
        sub_filter 'url: "/' 'url: "/dashboard_mission7/';
        sub_filter "url: '/" "url: '/dashboard_mission7/";
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter_once off;
    }

    # Mission 7 MLflow - Protected with auth (separate container)
    location /dashboard_mission7/mlflow/ {
        auth_request /internal/auth/check;
        error_page 401 = @mission7_login_redirect;
        error_page 502 503 504 = @mission7_unavailable;

        set $mlflow_backend http://mission7_mlflow_prod:5002;
        
        rewrite ^/dashboard_mission7/mlflow/(.*)$ /$1 break;
        proxy_pass $mlflow_backend;
        
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Named location for login redirect
    location @mission7_login_redirect {
        return 302 $scheme://$http_host/login?return_to=$request_uri;
    }

    # Named location for service unavailable
    location @mission7_unavailable {
        # Use internal redirect instead of proxy_pass in named location
        rewrite ^ /service-unavailable break;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    # Handle other dynamic requests
    location / {
        try_files $uri @flask;
    }

    # Proxy requests to Flask
    location @flask {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # Custom 404 error page
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/htmx_website;
    }
}
