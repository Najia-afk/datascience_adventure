<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission: Data Exploration</title>
    <link rel="stylesheet" href="/styles/modern-styles.css?v=layout8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>

<body hx-boost="true" class="app-container">
    <!-- Header loaded via HTMX -->
    <header id="header" class="site-header" hx-get="/header" hx-target="#header" hx-trigger="load"></header>

    <div class="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar collapsed" id="sidebar">
            <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">
                ▶
            </button>
            <div class="sidebar-content">
                <h3>Scripts Used</h3>
                <ul id="sidebar-list" class="sidebar-list">
                    <!-- This will be dynamically populated by the deploy script -->
                    <li>No scripts available</li>
                </ul>
            </div>
        </aside>

        <!-- Main Content Area -->
        <section class="content-area" id="main-content">
            <header class="project-header">
                <h1>Mission: Data Science Project</h1>
                <p>Exploring data science concepts and techniques.</p>
            </header>

            <!-- Google Colab Button -->
            <div style="margin-bottom: 1.5rem;">
                <a href="#" id="colab-button" class="btn btn-colab">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    Run on Google Colab
                </a>
            </div>

            <!-- Iframe Display for the Jupyter Notebook -->
            <div id="loading">
                <h3>Loading Notebook...</h3>
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>
                <p class="loading-message">This may take a moment for large notebooks.</p>
            </div>
            
            <div class="iframe-wrapper" style="visibility: hidden; height: 1px;">
                <iframe id="main-iframe" src="" scrolling="no"></iframe>
            </div>
        </section>
    </div>

    <footer class="site-footer">
        <p>&copy; 2025 DataScience Adventure. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Handling Iframe Resizing and Sidebar Position -->
    <script>
        // Define global variables only if not already defined
        if (typeof window.dsaApp === 'undefined') {
            window.dsaApp = {
                resizeCounter: 0,
                resizeTimer: null,
                initialized: false
            };
        }

        // Global toggle function
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebar-toggle');

            if (!sidebar || !toggleBtn) return;

            sidebar.classList.toggle('collapsed');

            if (sidebar.classList.contains('collapsed')) {
                toggleBtn.innerHTML = '▶';
            } else {
                toggleBtn.innerHTML = '◀';
            }
        }

        // Check if it's a mobile device and set initial state
        function checkMobileAndSetLayout() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebar-toggle');
            
            if (!sidebar || !toggleBtn) return;
            
            // Always start with sidebar collapsed by default (user preference)
            sidebar.classList.add('collapsed');
            toggleBtn.innerHTML = '▶';
        }
        
        // Function to handle iframe resizing
        function handleIframeResize() {
            const iframe = document.getElementById('main-iframe');
            const loadingIndicator = document.getElementById('loading');
            const iframeContainer = document.querySelector('.iframe-wrapper');

            if (!iframe || !loadingIndicator || !iframeContainer) return false;

            try {
                let documentHeight = 0;
                
                try {
                    documentHeight = iframe.contentWindow.document.body.scrollHeight;
                } catch (e) {
                    console.log("Standard height detection failed:", e);
                }
                
                if (!documentHeight) {
                    try {
                        documentHeight = iframe.contentWindow.document.documentElement.scrollHeight;
                    } catch (e) {
                        console.log("documentElement height detection failed:", e);
                    }
                }
                
                console.log("Detected iframe height:", documentHeight);
                
                if (documentHeight > 0) {
                    iframe.style.height = `${documentHeight + 50}px`;
                    loadingIndicator.style.display = 'none';
                    iframeContainer.style.visibility = 'visible';
                    iframeContainer.style.height = 'auto';
                    return true;
                }
            } catch (e) {
                console.error("Error accessing iframe content:", e);
            }
            return false;
        }

        // Function to simulate loading progress
        function simulateProgress() {
            const progressBar = document.querySelector('.progress-bar');
            if (!progressBar) return;
            
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 90) {
                    clearInterval(interval);
                } else {
                    width += Math.random() * 5;
                    progressBar.style.width = width + '%';
                }
            }, 200);
        }
        
        // Function to set up Colab URL
        function setupColabLink() {
            const iframe = document.getElementById('main-iframe');
            const colabButton = document.getElementById('colab-button');
            if (!iframe || !colabButton) return;
            
            let currentPath = window.location.pathname;
            currentPath = currentPath.replace(/\/$/, '');
            
            if (!currentPath || currentPath === '/') {
                const titleText = document.title;
                const missionMatch = titleText.match(/Mission\s+(\d+)/i);
                
                if (missionMatch && missionMatch[1]) {
                    currentPath = '/mission' + missionMatch[1];
                } else {
                    colabButton.style.display = 'none';
                    return;
                }
            }
            
            iframe.src = currentPath + '_content.html';
            
            const repoName = currentPath.replace(/^\//, '');
            const cleanRepoName = repoName.trim();
            colabButton.href = `https://colab.research.google.com/github/Najia-afk/${cleanRepoName}/blob/main/${cleanRepoName}.ipynb`;
        }
        
        // Initialize the page
        function initializePage() {
            if (window.dsaApp.initialized) return;
            
            window.dsaApp.initialized = true;
            setupColabLink();
            simulateProgress();
            
            if (window.dsaApp.resizeTimer) {
                clearInterval(window.dsaApp.resizeTimer);
            }
            
            window.dsaApp.resizeCounter = 0;
            window.dsaApp.resizeTimer = setInterval(function() {
                window.dsaApp.resizeCounter++;
                if (handleIframeResize() || window.dsaApp.resizeCounter >= 12) {
                    clearInterval(window.dsaApp.resizeTimer);
                    if (window.dsaApp.resizeCounter >= 12) {
                        const loadingIndicator = document.getElementById('loading');
                        const iframeContainer = document.querySelector('.iframe-wrapper');
                        if (loadingIndicator) loadingIndicator.style.display = 'none';
                        if (iframeContainer) {
                            iframeContainer.style.visibility = 'visible';
                            iframeContainer.style.height = 'auto';
                        }
                    }
                }
            }, 2000); // Check every 2 seconds
            
            window.addEventListener('resize', checkMobileAndSetLayout);
            
            const iframe = document.getElementById('main-iframe');
            if (iframe) {
                iframe.addEventListener('load', function() {
                    setTimeout(handleIframeResize, 500);
                });
            }
        }
        
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function() {
                checkMobileAndSetLayout();
                setTimeout(initializePage, 100);
            });
        } else {
            checkMobileAndSetLayout();
            setTimeout(initializePage, 100);
        }
    </script>
</body>
</html>
