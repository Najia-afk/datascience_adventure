<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission: Data Exploration</title>
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/footer.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/interactive.css">
    <link rel="stylesheet" href="/styles/contact.css">
    <link rel="stylesheet" href="/styles/portfolio.css">
    <link rel="stylesheet" href="/styles/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>

<body hx-boost="true" class="app-container">
    <!-- Header loaded via HTMX -->
    <header id="header" class="site-header" hx-get="/header" hx-target="#header" hx-trigger="load"></header>

    <div class="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-toggle-container">
                <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
            <div class="sidebar-content">
                <h3>Scripts Used</h3>
                <ul id="sidebar-list" class="sidebar-list">
                    <!-- This will be dynamically populated by the deploy script -->
                    <li>No scripts available</li>
                </ul>
            </div>
        </aside>

        <!-- Main Content Area -->
        <section class="content-area" id="main-content">
            <header class="project-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Mission: Data Science Project</h1>
                    <p>Exploring data science concepts and techniques.</p>
                </div>
                <a href="#" id="colab-button" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    Run on Google Colab
                </a>
            </header>

            <!-- Iframe Display for the Jupyter Notebook -->
            <div id="loading">
                <h3>Loading Notebook...</h3>
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>
                <p class="loading-message">This may take a moment for large notebooks.</p>
            </div>
            
            <div class="iframe-wrapper" style="visibility: hidden; height: 1px;">
                <iframe id="main-iframe" src="" scrolling="no"></iframe>
            </div>
        </section>
    </div>

    <footer class="site-footer">
        <p>&copy; 2025 DataScience Adventure. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Handling Iframe Resizing and Sidebar Position -->
    <script>
        // Define global variables only if not already defined
        if (typeof window.dsaApp === 'undefined') {
            window.dsaApp = {
                resizeCounter: 0,
                resizeTimer: null,
                initialized: false
            };
        }

        // Global toggle function
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const mainWrapper = document.querySelector('.main-wrapper');

            if (!sidebar || !toggleBtn) return;

            sidebar.classList.toggle('collapsed');
            if (mainWrapper) {
                mainWrapper.classList.toggle('sidebar-open');
            }

            if (sidebar.classList.contains('collapsed')) {
                toggleBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
            } else {
                toggleBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
            }
        }

        // Check if it's a mobile device and set initial state
        function checkMobileAndSetLayout() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebar-toggle');
            
            if (!sidebar || !toggleBtn) return;
            
            // Always start with sidebar collapsed by default (user preference)
            sidebar.classList.add('collapsed');
            toggleBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
        }
        
        // Function to handle iframe resizing
        function handleIframeResize() {
            const iframe = document.getElementById('main-iframe');
            const loadingIndicator = document.getElementById('loading');
            const iframeContainer = document.querySelector('.iframe-wrapper');

            if (!iframe || !loadingIndicator || !iframeContainer) return false;

            try {
                const iframeDoc = iframe.contentWindow.document;
                if (!iframeDoc) return false;

                const body = iframeDoc.body;
                const html = iframeDoc.documentElement;
                
                // Get the maximum height to ensure we catch everything
                const height = Math.max(
                    body.scrollHeight, body.offsetHeight,
                    html.clientHeight, html.scrollHeight, html.offsetHeight
                );
                
                console.log("Detected iframe height:", height);
                
                if (height > 0) {
                    // Only update if height changed significantly to avoid jitter
                    const currentHeight = parseInt(iframe.style.height || 0);
                    if (Math.abs(height + 50 - currentHeight) > 10) {
                        iframe.style.height = `${height + 50}px`;
                    }
                    
                    // Show content if not already visible
                    if (loadingIndicator.style.display !== 'none') {
                        loadingIndicator.style.display = 'none';
                        iframeContainer.style.visibility = 'visible';
                        iframeContainer.style.height = 'auto';
                        
                        // Start observing for future changes
                        setupResizeObserver(body);
                    }
                    
                    return true;
                }
            } catch (e) {
                console.error("Error accessing iframe content:", e);
            }
            return false;
        }

        function setupResizeObserver(targetNode) {
            // Prevent multiple observers
            if (window.dsaApp.resizeObserver) return;

            if ('ResizeObserver' in window) {
                window.dsaApp.resizeObserver = new ResizeObserver(entries => {
                    handleIframeResize();
                });
                window.dsaApp.resizeObserver.observe(targetNode);
                console.log("ResizeObserver attached to iframe content");
            }
        }

        // Function to simulate loading progress
        function simulateProgress() {
            const progressBar = document.querySelector('.progress-bar');
            if (!progressBar) return;
            
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 90) {
                    clearInterval(interval);
                } else {
                    width += Math.random() * 5;
                    progressBar.style.width = width + '%';
                }
            }, 200);
        }
        
        // Function to set up Colab URL
        function setupColabLink() {
            const iframe = document.getElementById('main-iframe');
            const colabButton = document.getElementById('colab-button');
            if (!iframe || !colabButton) return;
            
            let currentPath = window.location.pathname;
            currentPath = currentPath.replace(/\/$/, '');
            
            if (!currentPath || currentPath === '/') {
                const titleText = document.title;
                const missionMatch = titleText.match(/Mission\s+(\d+)/i);
                
                if (missionMatch && missionMatch[1]) {
                    currentPath = '/mission' + missionMatch[1];
                } else {
                    colabButton.style.display = 'none';
                    return;
                }
            }
            
            iframe.src = currentPath + '_content.html';
            
            const repoName = currentPath.replace(/^\//, '');
            const cleanRepoName = repoName.trim();
            colabButton.href = `https://colab.research.google.com/github/Najia-afk/${cleanRepoName}/blob/main/${cleanRepoName}.ipynb`;
        }
        
        // Initialize the page
        function initializePage() {
            // Reset loading state
            const loadingIndicator = document.getElementById('loading');
            const iframeContainer = document.querySelector('.iframe-wrapper');
            const iframe = document.getElementById('main-iframe');
            
            if (loadingIndicator) loadingIndicator.style.display = 'block';
            if (iframeContainer) {
                iframeContainer.style.visibility = 'hidden';
                iframeContainer.style.height = '1px';
            }
            
            setupColabLink();
            simulateProgress();
            
            if (window.dsaApp.resizeTimer) {
                clearInterval(window.dsaApp.resizeTimer);
            }
            
            window.dsaApp.resizeCounter = 0;
            window.dsaApp.resizeTimer = setInterval(function() {
                window.dsaApp.resizeCounter++;
                const loaded = handleIframeResize();
                
                // Stop polling only after a long time (60s) to allow for large files
                // We rely on ResizeObserver for updates, but keep polling as backup
                if (window.dsaApp.resizeCounter >= 30) {
                    clearInterval(window.dsaApp.resizeTimer);
                    
                    // Ensure it's visible even if we timed out (fallback)
                    const loadingIndicator = document.getElementById('loading');
                    const iframeContainer = document.querySelector('.iframe-wrapper');
                    if (loadingIndicator) loadingIndicator.style.display = 'none';
                    if (iframeContainer) {
                        iframeContainer.style.visibility = 'visible';
                        iframeContainer.style.height = 'auto';
                    }
                }
            }, 2000); // Check every 2 seconds
            
            window.addEventListener('resize', checkMobileAndSetLayout);
            
            if (iframe) {
                // Remove old listeners to prevent duplicates if re-initializing
                const newIframe = iframe.cloneNode(true);
                iframe.parentNode.replaceChild(newIframe, iframe);
                
                newIframe.addEventListener('load', function() {
                    setTimeout(handleIframeResize, 500);
                });
            }
            
            // Initialize Flyout Menus
            initFlyoutMenus();
        }
        
        // Flyout Menu Logic
        function initFlyoutMenus() {
            const categories = document.querySelectorAll('.repo-category');
            const sidebar = document.getElementById('sidebar');
            
            categories.forEach(category => {
                const header = category.querySelector('.category-header');
                const scripts = category.querySelector('.category-scripts');
                
                if (!header || !scripts) return;
                
                let timeoutId;

                const showMenu = () => {
                    clearTimeout(timeoutId);
                    
                    const rect = header.getBoundingClientRect();
                    const sidebarRect = sidebar.getBoundingClientRect();
                    
                    // Calculate position relative to sidebar (which is the containing block due to backdrop-filter)
                    // We subtract sidebarRect.top/left to convert viewport coordinates to sidebar-relative coordinates
                    let topPos = rect.top - sidebarRect.top;
                    let leftPos = rect.right - sidebarRect.left + 5; // 5px gap
                    
                    const menuHeight = scripts.offsetHeight || 300; 
                    const windowHeight = window.innerHeight;
                    
                    // Check if menu would go off screen (using viewport coordinates)
                    if (rect.top + menuHeight > windowHeight) {
                        // Shift up
                        // Target viewport top: windowHeight - menuHeight - 20
                        // Convert to relative: target - sidebarRect.top
                        topPos = (windowHeight - menuHeight - 20) - sidebarRect.top;
                        
                        // Don't go above the sidebar top
                        if (topPos < 0) topPos = 0;
                    }
                    
                    scripts.style.top = `${topPos}px`;
                    scripts.style.left = `${leftPos}px`;
                    scripts.classList.add('visible');
                };

                const hideMenu = () => {
                    timeoutId = setTimeout(() => {
                        scripts.classList.remove('visible');
                    }, 300); // 300ms delay to allow crossing the gap
                };
                
                // Use mouseenter on category to keep menu open when moving mouse to it
                category.addEventListener('mouseenter', showMenu);
                category.addEventListener('mouseleave', hideMenu);

                // Also keep menu open when hovering over the menu itself
                scripts.addEventListener('mouseenter', () => {
                    clearTimeout(timeoutId);
                });
                scripts.addEventListener('mouseleave', hideMenu);
            });
            
            // Initialize Draggable Sidebar
            initDraggableSidebar();
        }
        
        // Draggable Sidebar Logic
        function initDraggableSidebar() {
            const sidebar = document.getElementById('sidebar');
            const handle = document.querySelector('.sidebar-toggle-container');
            
            if (!sidebar || !handle) return;
            
            let isDragging = false;
            let startY;
            let startTop;
            
            handle.addEventListener('mousedown', (e) => {
                // Only allow dragging if not clicking the button itself (optional, but good UX)
                if (e.target.id === 'sidebar-toggle') return;
                
                isDragging = true;
                startY = e.clientY;
                startTop = sidebar.offsetTop;
                
                // Prevent text selection while dragging
                document.body.style.userSelect = 'none';
                sidebar.style.transition = 'none'; // Disable transition during drag
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const deltaY = e.clientY - startY;
                let newTop = startTop + deltaY;
                
                // Constrain to viewport
                const maxTop = window.innerHeight - 100; // Keep at least 100px visible
                if (newTop < 80) newTop = 80; // Don't go above header
                if (newTop > maxTop) newTop = maxTop;
                
                sidebar.style.top = `${newTop}px`;
            });
            
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.userSelect = '';
                    sidebar.style.transition = ''; // Re-enable transition
                }
            });
        }

        // HTMX Events for Loading Bar
        document.body.addEventListener('htmx:configRequest', function(evt) {
            const loadingIndicator = document.getElementById('loading');
            const iframeContainer = document.querySelector('.iframe-wrapper');
            
            if (loadingIndicator) loadingIndicator.style.display = 'block';
            if (iframeContainer) iframeContainer.style.visibility = 'hidden';
        });

        document.body.addEventListener('htmx:afterSwap', function(evt) {
            // Re-initialize page after HTMX content swap
            initializePage();
        });
        
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function() {
                checkMobileAndSetLayout();
                setTimeout(initializePage, 100);
            });
        } else {
            checkMobileAndSetLayout();
            setTimeout(initializePage, 100);
        }
    </script>
</body>
</html>
