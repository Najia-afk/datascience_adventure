<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datascience Adventure</title>
    <link rel="stylesheet" href="/styles/variables.css?v=3">
    <link rel="stylesheet" href="/styles/base.css?v=3">
    <link rel="stylesheet" href="/styles/layout.css?v=3">
    <link rel="stylesheet" href="/styles/header.css?v=3">
    <link rel="stylesheet" href="/styles/footer.css?v=3">
    <link rel="stylesheet" href="/styles/components.css?v=3">
    <link rel="stylesheet" href="/styles/sidebar.css?v=3">
    <link rel="stylesheet" href="/styles/interactive.css?v=3">
    <link rel="stylesheet" href="/styles/contact.css?v=3">
    <link rel="stylesheet" href="/styles/responsive.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <!-- Google OAuth Configuration - rendered server-side -->
    <script>
        window.DSA_CONFIG = {
            GOOGLE_CLIENT_ID: "{{ google_client_id }}",
            GOOGLE_REDIRECT_URI: window.location.origin + "/login"
        };
    </script>
</head>

<body hx-boost="true" class="app-container">
    <!-- Header will be dynamically loaded -->
    <header id="header" class="site-header" hx-get="/header" hx-target="#header" hx-trigger="load"></header>

    <div class="main-wrapper">
        <main id="main-content" class="content-area">
            <!-- Summary will be dynamically loaded by default -->
            <div id="default-content" hx-get="/summary" hx-target="#main-content" hx-trigger="load"></div>
        </main>
    </div>

    <!-- Footer will be dynamically loaded -->
    <footer id="footer" class="site-footer" hx-get="/footer" hx-target="#footer" hx-trigger="load"></footer>
</body>
</html>
