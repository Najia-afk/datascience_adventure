<div id="dashboard-container" style="width: 100%; height: calc(100vh - 160px); min-height: 600px;">
    <!-- Loading state -->
    <div id="dashboard-loading" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #94a3b8;">
        <span>Loading dashboard...</span>
    </div>
    
    <!-- Auth required message (hidden by default) -->
    <div id="dashboard-auth-required" style="display: none; padding: 3rem 2rem; text-align: center; height: 100%;">
        <div style="background: #141b22; border: 1px solid #1e293b; border-radius: 4px; padding: 48px; max-width: 440px; margin: 0 auto;">
            <div style="font-size: 1.5rem; font-weight: 700; color: #00dcff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px;">DataScience Adventure</div>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 32px;">Portfolio & ML Dashboard</p>

            <div style="background: rgba(0, 220, 255, 0.05); border: 1px solid #00dcff; border-radius: 4px; padding: 24px; margin-bottom: 32px;">
                <h2 style="color: #00dcff; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: 1px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Authentication Required
                </h2>
                <p style="color: #e2e8f0; font-size: 0.9rem; line-height: 1.6;">
                    Access to the Dashboard requires authentication. Please sign in with your Google account to continue.
                </p>
            </div>

            <button id="dashboard-signin-button" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; background: #00dcff; border: none; border-radius: 4px; padding: 14px 28px; font-size: 1rem; font-weight: 600; color: #06080a; cursor: pointer; width: 100%; transition: all 0.2s ease;">
                <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285f4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34a853"/>
                    <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#fbbc05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" fill="#ea4335"/>
                </svg>
                Sign in with Google
            </button>

            <div style="margin: 28px 0; color: #94a3b8; font-size: 0.85rem; position: relative;">
                <span style="background: #141b22; padding: 0 10px; position: relative; z-index: 1;">or</span>
                <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #1e293b; z-index: 0;"></div>
            </div>

            <a href="#" hx-get="/summary" hx-target="#main-content" hx-swap="innerHTML" style="color: #00dcff; text-decoration: none; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Portfolio
            </a>
        </div>
    </div>
    
    <!-- Dashboard iframe (hidden by default) -->
    <iframe id="dashboard-iframe" src="" style="display: none; width: 100%; height: 100%; border: none;"></iframe>
</div>

<script>
(function() {
    // Check auth status and show appropriate content
    fetch('/auth/user')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            document.getElementById('dashboard-loading').style.display = 'none';
            
            if (data.authenticated) {
                // Show iframe with mission7 dashboard
                var iframe = document.getElementById('dashboard-iframe');
                iframe.src = '/dashboard_mission7/';
                iframe.style.display = 'block';
            } else {
                // Show auth required message
                document.getElementById('dashboard-auth-required').style.display = 'block';
                
                // Attach click handler to sign-in button (uses global function from header)
                var btn = document.getElementById('dashboard-signin-button');
                if (btn && typeof window.DSA_initiateGoogleOAuth === 'function') {
                    btn.onclick = window.DSA_initiateGoogleOAuth;
                }
            }
        })
        .catch(function() {
            document.getElementById('dashboard-loading').style.display = 'none';
            document.getElementById('dashboard-auth-required').style.display = 'block';
            
            var btn = document.getElementById('dashboard-signin-button');
            if (btn && typeof window.DSA_initiateGoogleOAuth === 'function') {
                btn.onclick = window.DSA_initiateGoogleOAuth;
            }
        });
})();
</script>
