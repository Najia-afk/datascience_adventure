<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Data Science Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #06080a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #141b22;
            border: 1px solid #1e293b;
            border-radius: 4px;
            padding: 48px;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #00dcff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .restricted-notice {
            background: rgba(0, 220, 255, 0.05);
            border: 1px solid #00dcff;
            border-radius: 4px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .restricted-notice h2 {
            color: #00dcff;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .restricted-notice p {
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #00dcff;
            border: none;
            border-radius: 4px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #06080a;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .google-btn:hover {
            background: #00a3cc;
            transform: translateY(-1px);
        }

        .google-btn svg {
            width: 20px;
            height: 20px;
        }

        .divider {
            margin: 28px 0;
            color: #94a3b8;
            font-size: 0.85rem;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #1e293b;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .back-link {
            color: #00dcff;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            display: none;
            margin-top: 20px;
            color: #94a3b8;
        }

        .loading.active {
            display: block;
        }
        
        .success-message {
            color: #00dcff;
            margin-top: 20px;
            display: none;
        }
        
        .success-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">DataScience Adventure</div>
        <p class="subtitle">Portfolio & ML Dashboard</p>

        <div class="restricted-notice">
            <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Authentication Required
            </h2>
            <p>Access to the Dashboard requires authentication. Please sign in with your Google account to continue.</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <button id="google-signin-button" class="google-btn">
            <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285f4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34a853"/>
                <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#fbbc05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" fill="#ea4335"/>
            </svg>
            Sign in with Google
        </button>

        <div id="loading" class="loading">Authenticating...</div>
        <div id="success-message" class="success-message">Login successful! Redirecting...</div>

        <div class="divider">or</div>

        <a href="/" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Portfolio
        </a>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = "{{ google_client_id }}";
        const GOOGLE_REDIRECT_URI = window.location.origin + "/login";
        const GOOGLE_OAUTH_URL = "https://accounts.google.com/o/oauth2/v2/auth";
        const GOOGLE_OAUTH_SCOPES = [
            "https://www.googleapis.com/auth/userinfo.email",
            "https://www.googleapis.com/auth/userinfo.profile",
            "openid"
        ];
        
        // Detect if we're in a popup
        const isPopup = window.opener && !window.opener.closed;

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function initiateGoogleOAuth() {
            if (!GOOGLE_CLIENT_ID) {
                showError('Google OAuth not configured. Please contact the administrator.');
                return;
            }

            const state = crypto.randomUUID();
            localStorage.setItem("oauth_state", state);
            
            // Store return URL only if not in popup mode
            if (!isPopup) {
                const returnTo = new URLSearchParams(window.location.search).get('return_to') || '/';
                localStorage.setItem("oauth_return_to", returnTo);
            }

            const params = new URLSearchParams({
                client_id: GOOGLE_CLIENT_ID,
                redirect_uri: GOOGLE_REDIRECT_URI,
                access_type: "offline",
                response_type: "code",
                state: state,
                scope: GOOGLE_OAUTH_SCOPES.join(" "),
                prompt: "consent"
            });

            // If in popup, redirect within popup; otherwise open new popup
            if (isPopup) {
                window.location.href = `${GOOGLE_OAUTH_URL}?${params.toString()}`;
            } else {
                // Open as popup for standalone login page
                const width = 500;
                const height = 600;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                window.open(`${GOOGLE_OAUTH_URL}?${params.toString()}`, 'google_login', `width=${width},height=${height},top=${top},left=${left}`);
            }
        }

        function handleOAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get("code");
            const state = urlParams.get("state");
            const error = urlParams.get("error");

            if (error) {
                showError("Authentication failed: " + error);
                window.history.replaceState({}, document.title, window.location.pathname);
                if (isPopup) {
                    setTimeout(() => window.close(), 2000);
                }
                return;
            }

            if (code && state) {
                const storedState = localStorage.getItem("oauth_state");
                window.history.replaceState({}, document.title, window.location.pathname);

                if (state !== storedState) {
                    showError("Security error: State mismatch. Please try again.");
                    localStorage.removeItem("oauth_state");
                    return;
                }

                document.getElementById('loading').classList.add('active');
                document.getElementById('google-signin-button').style.display = 'none';

                fetch("/auth/google/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('loading').classList.remove('active');
                        document.getElementById('success-message').classList.add('active');
                        
                        // If we're in a popup, reload the opener and close
                        if (window.opener && !window.opener.closed) {
                            window.opener.location.reload();
                            setTimeout(() => window.close(), 500);
                        } else {
                            // Regular navigation - redirect to stored return URL or home
                            const returnTo = localStorage.getItem("oauth_return_to") || '/';
                            localStorage.removeItem("oauth_return_to");
                            setTimeout(() => {
                                window.location.href = returnTo;
                            }, 500);
                        }
                    } else {
                        showError("Login failed: " + data.error);
                        document.getElementById('loading').classList.remove('active');
                        document.getElementById('google-signin-button').style.display = 'flex';
                    }
                })
                .catch(err => {
                    showError("Network error. Please try again.");
                    document.getElementById('loading').classList.remove('active');
                    document.getElementById('google-signin-button').style.display = 'flex';
                });

                localStorage.removeItem("oauth_state");
            }
        }

        document.getElementById("google-signin-button").addEventListener("click", initiateGoogleOAuth);
        handleOAuthCallback();
    </script>
</body>
</html>
