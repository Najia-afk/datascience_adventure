<header class="top-bar">
    <div class="logo">
        <img src="/logos/logo_dsa.png" alt="Logo" class="logo-img">
        <span>Datascience Adventure</span>
    </div>
    <nav class="top-nav">
        <a href="#" hx-get="/summary" hx-target="#main-content" hx-swap="innerHTML" class="nav-link">Home</a>
        <div class="dropdown">
            <button class="dropbtn">Datascientist Training</button>
            <div class="dropdown-content">
                <a href="#" hx-get="/mission2/" hx-target="#main-content" hx-swap="innerHTML" class="dropdown-link">Mission 2</a>
                <a href="#" hx-get="/mission3/" hx-target="#main-content" hx-swap="innerHTML" class="dropdown-link">Mission 3</a>
                <a href="#" hx-get="/mission4/" hx-target="#main-content" hx-swap="innerHTML" class="dropdown-link">Mission 4</a>
                <a href="#" hx-get="/mission5/" hx-target="#main-content" hx-swap="innerHTML" class="dropdown-link">Mission 5</a>
                <a href="#" hx-get="/mission6/" hx-target="#main-content" hx-swap="innerHTML" class="dropdown-link">Mission 5</a>
            </div>
        </div>
        <a href="#" hx-get="/load-contact" hx-target="#main-content" hx-swap="innerHTML" class="nav-link">Contact</a>
        <button class="dark-mode-toggle" hx-get="/toggle-dark-mode" hx-target="body" hx-swap="innerHTML" class="nav-link">🌙</button>
    </nav>
</header>

<script>
    document.addEventListener('htmx:afterSwap', function (event) {
        if (event.target.id === "header") {
            const header = document.querySelector('.top-bar');
            window.addEventListener('scroll', function () {
                if (window.scrollY > 50) {
                    header.classList.add('shrink');
                } else {
                    header.classList.remove('shrink');
                }
            });
        }
    });
</script>
