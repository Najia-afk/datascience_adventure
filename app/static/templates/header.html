<header class="top-bar">
    <div class="logo">
        <img src="/logos/logo_dsa.png" alt="Logo" class="logo-img">
        <span>Datascience Adventure</span>
    </div>
    <nav class="top-nav">
        <a href="/" class="nav-link">Home</a>
        <div class="dropdown">
            <button class="dropbtn">Datascientist Training</button>
            <div class="dropdown-content">
                <!-- Changed from HTMX approach to direct links -->
                <a href="/mission2/" class="dropdown-link">Mission 2</a>
                <a href="/mission3/" class="dropdown-link">Mission 3</a>
                <a href="/mission4/" class="dropdown-link">Mission 4</a>
                <a href="/mission5/" class="dropdown-link">Mission 5</a>
            </div>
        </div>
        <a href="/contact/" class="nav-link">Contact</a>
        <button class="dark-mode-toggle" id="dark-mode-toggle" class="nav-link">🌙</button>
    </nav>
</header>

<script>
    document.addEventListener('htmx:afterSwap', function (event) {
        if (event.target.id === "header") {
            const header = document.querySelector('.top-bar');
            window.addEventListener('scroll', function () {
                if (window.scrollY > 50) {
                    header.classList.add('shrink');
                } else {
                    header.classList.remove('shrink');
                }
            });
        }
    });
    
    // Handle dark mode toggle with regular JS instead of HTMX
    document.getElementById('dark-mode-toggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        // Save preference to localStorage
        if (document.body.classList.contains('dark-mode')) {
            localStorage.setItem('darkMode', 'true');
            this.textContent = '☀️';
        } else {
            localStorage.setItem('darkMode', 'false');
            this.textContent = '🌙';
        }
    });
    
    // Check for saved dark mode preference
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('dark-mode-toggle').textContent = '☀️';
    }
</script>
